name: VS Code extension
on:
  workflow_call:

permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/vscode-pokemon/package-lock.json
      - run: npm ci --prefix tools/vscode-pokemon
      - run: npm test --prefix tools/vscode-pokemon
      - run: npm run package --prefix tools/vscode-pokemon
      - uses: actions/upload-artifact@v7
        with:
          name: pokemon-story-vsix
          path: tools/vscode-pokemon/*.vsix
